<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Siddharth Soni — AI Engineer</title>
<meta name="description" content="Siddharth Soni is an AI/ML Engineer building production-grade Generative AI systems — agentic pipelines, RAG, and LLM fine-tuning for financial audit and compliance automation." />
<meta property="og:title" content="Siddharth Soni — AI Engineer" />
<meta property="og:description" content="AI/ML Engineer building production-grade Generative AI and agentic systems for financial audit, compliance, and document automation." />
<meta property="og:type" content="website" />
<meta property="og:image" content="Siddharth.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #07090e;
    --glass-surface: rgba(16, 21, 36, 0.58);
    --glass-card: rgba(17, 24, 39, 0.45);
    --glass-card-hover: rgba(26, 35, 58, 0.65);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-border-hover: rgba(0, 245, 212, 0.28);
    --glass-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
    
    --accent: #00f5d4;
    --accent2: #8b5cf6;
    --accent3: #f43f5e;
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --muted: #64748b;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow-x: hidden;
    line-height: 1.6;
  }

  ::selection { background: rgba(0, 245, 212, 0.3); color: #fff; }

  /* Ambient Glassmorphic Background Orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }
  .orb-1 { width: 550px; height: 550px; background: radial-gradient(circle, var(--accent2), transparent 70%); top: -100px; right: -100px; }
  .orb-2 { width: 650px; height: 650px; background: radial-gradient(circle, rgba(0, 245, 212, 0.35), transparent 70%); top: 35%; left: -200px; }
  .orb-3 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(139, 92, 246, 0.25), transparent 70%); bottom: -100px; right: 10%; }

  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  nav, .hero, section, footer { position: relative; z-index: 1; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Navigation */
  nav {
    position: fixed;
    top: 16px; left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 64px);
    max-width: 1240px;
    z-index: 100;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(11, 15, 25, 0.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 9999px;
    box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.5);
    transition: all 0.3s ease;
  }
  .nav-logo {
    font-weight: 800;
    font-size: 1.05rem;
    color: #fff;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .nav-logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 32px; align-items: center; }
  .nav-links a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    transition: color 0.2s ease;
  }
  .nav-links a:hover { color: var(--accent); }
  .nav-toggle {
    display: none;
    background: transparent;
    border: 1px solid var(--glass-border);
    color: var(--text);
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    backdrop-filter: blur(8px);
  }

  /* Hero Section */
  .hero {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    align-items: center;
    gap: 48px;
    max-width: 1240px;
    margin: 0 auto;
    padding: 140px 32px 80px;
  }
  .hero-inner { max-width: 680px; }
  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(0, 245, 212, 0.08);
    border: 1px solid rgba(0, 245, 212, 0.25);
    backdrop-filter: blur(12px);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--accent);
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 28px;
    box-shadow: 0 0 20px rgba(0, 245, 212, 0.12);
  }
  .hero-tag::before {
    content: '';
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.7); } }

  h1 {
    font-size: clamp(2.8rem, 6vw, 4.6rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.04em;
    margin-bottom: 24px;
    color: #fff;
  }
  h1 .accent {
    background: linear-gradient(135deg, var(--accent) 20%, #60a5fa 90%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  h1 .italic {
    display: block;
    font-size: 0.55em;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: -0.01em;
    margin-top: 8px;
  }

  .hero-desc {
    font-size: 1rem;
    line-height: 1.75;
    color: var(--text-dim);
    max-width: 580px;
    margin-bottom: 38px;
  }

  .hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 48px; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #00c9aa);
    color: #031310;
    padding: 13px 28px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 8px 24px rgba(0, 245, 212, 0.25);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(0, 245, 212, 0.4);
  }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px);
    color: var(--text);
    padding: 13px 28px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
    color: #fff;
    transform: translateY(-2px);
  }

  .hero-stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .stat-item {
    background: var(--glass-card);
    backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 16px 24px;
    flex: 1 1 140px;
    transition: all 0.25s ease;
  }
  .stat-item:hover {
    border-color: var(--glass-border-hover);
    transform: translateY(-2px);
  }
  .stat-num {
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(135deg, #fff, var(--text-dim));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
  }
  .stat-label {
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
    margin-top: 4px;
  }

  /* Photo Card */
  .hero-photo-wrap {
    position: relative;
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
    aspect-ratio: 4 / 5;
    border-radius: 28px;
    padding: 12px;
    background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.01));
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.6);
  }
  .hero-blob {
    position: absolute;
    inset: 10px;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(0, 245, 212, 0.3));
    border-radius: 20px;
    filter: blur(28px);
    z-index: 0;
  }
  .hero-photo {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .hero-photo-placeholder {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-size: 0.75rem;
    color: var(--text-dim);
    background: rgba(16, 21, 36, 0.4);
    border: 1px dashed rgba(255, 255, 255, 0.2);
    border-radius: 20px;
  }

  /* Sections */
  section {
    max-width: 1240px;
    margin: 0 auto;
    padding: 100px 32px;
  }
  .section-label {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .section-title {
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 48px;
    color: #fff;
  }
  .section-title em {
    font-style: normal;
    background: linear-gradient(135deg, #fff, var(--text-dim));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Projects Grid */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  .project-card {
    background: var(--glass-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 36px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: var(--glass-glow);
  }
  .project-card:hover {
    background: var(--glass-card-hover);
    border-color: var(--glass-border-hover);
    transform: translateY(-4px);
    box-shadow: 0 16px 36px rgba(0, 245, 212, 0.08);
  }
  .project-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }
  .project-icon {
    width: 44px; height: 44px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
  }
  .project-title {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: -0.02em;
    color: #fff;
  }
  .project-desc {
    font-size: 0.86rem;
    line-height: 1.7;
    color: var(--text-dim);
    margin-bottom: 20px;
  }
  .project-metric {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 500;
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.08);
    border-left: 2px solid #38bdf8;
    padding: 8px 12px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 20px;
  }
  .project-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: auto;
  }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.04em;
    padding: 5px 10px;
    border-radius: 8px;
    background: rgba(139, 92, 246, 0.1);
    border: 1px solid rgba(139, 92, 246, 0.25);
    color: #c4b5fd;
    text-transform: uppercase;
  }
  .tag.green {
    background: rgba(0, 245, 212, 0.08);
    border-color: rgba(0, 245, 212, 0.25);
    color: var(--accent);
  }
  .tag.red {
    background: rgba(244, 63, 94, 0.08);
    border-color: rgba(244, 63, 94, 0.25);
    color: var(--accent3);
  }
  .project-links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--glass-border);
  }
  .project-link {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-decoration: none;
    padding: 9px 18px;
    border-radius: 10px;
    border: 1px solid rgba(0, 245, 212, 0.35);
    background: rgba(0, 245, 212, 0.05);
    color: var(--accent);
    transition: all 0.2s ease;
  }
  .project-link:hover {
    background: var(--accent);
    color: #000;
    box-shadow: 0 0 16px rgba(0, 245, 212, 0.4);
  }
  .project-link.ghost {
    border-color: var(--glass-border);
    background: rgba(255, 255, 255, 0.02);
    color: var(--text-dim);
  }
  .project-link.ghost:hover {
    border-color: rgba(255, 255, 255, 0.25);
    color: #fff;
    background: rgba(255, 255, 255, 0.06);
  }

  /* Experience */
  .experience-list { display: flex; flex-direction: column; gap: 20px; }
  .exp-card {
    background: var(--glass-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 36px;
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 36px;
    transition: all 0.25s ease;
  }
  .exp-card:hover {
    background: var(--glass-card-hover);
    border-color: var(--glass-border-hover);
    transform: translateY(-2px);
  }
  .exp-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .exp-company {
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }
  .exp-location {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .exp-role {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: #fff;
  }
  .role-badge {
    font-size: 0.65rem;
    padding: 4px 10px;
    background: rgba(0, 245, 212, 0.08);
    border: 1px solid rgba(0, 245, 212, 0.25);
    border-radius: 999px;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }
  .exp-bullets { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .exp-bullets li {
    font-size: 0.85rem;
    line-height: 1.7;
    color: var(--text-dim);
    padding-left: 20px;
    position: relative;
  }
  .exp-bullets li::before {
    content: '›';
    position: absolute;
    left: 0;
    top: -1px;
    color: var(--accent);
    font-size: 1.1rem;
    font-weight: 600;
  }
  .highlight { color: #fff; font-weight: 500; }

  /* Skills */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  .skill-group {
    background: var(--glass-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 28px 24px;
    transition: all 0.25s ease;
  }
  .skill-group:hover {
    border-color: var(--glass-border-hover);
    transform: translateY(-2px);
  }
  .skill-group-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--glass-border);
  }
  .skill-list { display: flex; flex-direction: column; gap: 10px; }
  .skill-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.82rem;
    color: var(--text-dim);
  }
  .skill-dot {
    width: 6px;
    height: 6px;
    background: var(--accent2);
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 8px var(--accent2);
  }

  /* Certifications */
  .certs-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 20px;
  }
  .cert-card {
    background: var(--glass-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    transition: all 0.25s ease;
  }
  .cert-card:hover {
    border-color: rgba(139, 92, 246, 0.35);
    transform: translateY(-2px);
  }
  .cert-icon { font-size: 2rem; flex-shrink: 0; }
  .cert-name {
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 4px;
    color: #fff;
  }
  .cert-issuer {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  /* Contact */
  .contact-section {
    text-align: center;
    padding: 120px 32px;
  }
  .contact-box {
    background: var(--glass-card);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(24px);
    border-radius: 32px;
    padding: 60px 32px;
    box-shadow: var(--glass-glow);
  }
  .contact-email {
    font-size: clamp(1.4rem, 4vw, 2.8rem);
    font-weight: 800;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 90%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-decoration: none;
    letter-spacing: -0.02em;
    display: inline-block;
    margin-bottom: 40px;
    transition: opacity 0.2s ease;
  }
  .contact-email:hover { opacity: 0.8; }
  .contact-links {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .contact-link {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 500;
    padding: 12px 24px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .contact-link:hover {
    color: #fff;
    border-color: var(--accent);
    background: rgba(0, 245, 212, 0.06);
    transform: translateY(-2px);
  }

  /* Footer */
  footer {
    max-width: 1240px;
    margin: 0 auto;
    padding: 32px;
    border-top: 1px solid var(--glass-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  footer p {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  /* Animation states */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    * { animation-duration: 0.01ms !important; }
  }

  @media (max-width: 1100px) {
    .skills-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 900px) {
    nav {
      top: 12px;
      width: calc(100% - 32px);
      padding: 12px 20px;
      border-radius: 18px;
    }
    .nav-toggle { display: flex; align-items: center; justify-content: center; }
    .nav-links {
      position: absolute;
      top: 60px; left: 0; right: 0;
      flex-direction: column;
      align-items: flex-start;
      gap: 18px;
      padding: 24px;
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: all 0.25s ease;
    }
    .nav-links.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .hero {
